name: Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: "--bundles deb"
          - os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm test
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        # npm uses cmd.exe for package scripts on Windows; invoke the POSIX build explicitly.
        shell: bash
        run: bash ./tools/build-desktop.sh
      - name: Build desktop bundles
        run: npx tauri build ${{ matrix.args }}
      - name: Stage portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/mdedit.exe portable/MDedit-portable-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mdedit-windows-portable
          path: portable/MDedit-portable-x64.exe
          if-no-files-found: error
