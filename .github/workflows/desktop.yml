name: Desktop
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: "--bundles deb"
          - os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm test
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        # npm uses cmd.exe for package scripts on Windows; invoke the POSIX build explicitly.
        shell: bash
        run: bash ./tools/build-desktop.sh
      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build desktop bundles
        run: npx tauri build ${{ matrix.args }}
      - name: Stage portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/mdedit.exe portable/MDedit-portable-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mdedit-windows-portable
          path: portable/MDedit-portable-x64.exe
          if-no-files-found: error

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser interactions
        run: npm run test:browser

  performance:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        shell: bash
        run: bash ./tools/build-desktop.sh
      - name: Test 250 MB session performance
        run: npm run test:performance
      - name: Measure native 5 MiB recovery write
        env:
          MDEDIT_NATIVE_RECOVERY_METRICS_PATH: test-results/native-recovery-metrics.json
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --test recovery_performance -- --ignored --nocapture
      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabbed-editor-performance-metrics
          path: test-results/*-metrics.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, performance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mdedit-*
          path: release-inputs
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          mkdir -p release-assets
          expected_assets=(
            "MDedit-portable-x64.exe"
            "MDedit_${version}_x64-setup.exe"
            "MDedit_${version}_x64_en-US.msi"
            "MDedit_${version}_aarch64.dmg"
            "MDedit_${version}_amd64.deb"
          )
          for expected_asset in "${expected_assets[@]}"; do
            mapfile -t matches < <(find release-inputs -type f -name "$expected_asset" -print | sort)
            printf '%s\n' "${matches[@]}"
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" release-assets/
          done
          mapfile -t staged_assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          printf '%s\n' "${staged_assets[@]}"
          test "${#staged_assets[@]}" -eq 5
          for staged_asset in "${staged_assets[@]}"; do
            test -s "$staged_asset"
          done
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_lookup=$(mktemp)
          trap 'rm -f "$release_lookup"' EXIT
          if gh api --include "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" >"$release_lookup" 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          elif grep -Eq '^HTTP/[0-9.]+ 404( |$)' "$release_lookup"; then
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "MDedit $GITHUB_REF_NAME" --generate-notes
          else
            cat "$release_lookup" >&2
            exit 1
          fi
