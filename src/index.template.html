<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MDedit — Markdown editor</title>
<meta name="description" content="A fast, private desktop Markdown editor with live preview, Mermaid diagrams, KaTeX math, native file handling, and offline exports.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --panel: #ffffff;
    --border: #e4e4e7;
    --border-soft: #ececef;
    --text: #18181b;
    --text-soft: #52525b;
    --text-faint: #a1a1aa;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.08);
    --code-bg: #f4f4f5;
    --danger: #dc2626;
    --warning: #b45309;
    --modal-backdrop: rgba(24, 24, 27, 0.48);
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #111113;
    --panel: #18181b;
    --border: #27272a;
    --border-soft: #202023;
    --text: #e4e4e7;
    --text-soft: #a1a1aa;
    --text-faint: #63636b;
    --accent: #60a5fa;
    --accent-soft: rgba(96, 165, 250, 0.10);
    --code-bg: #1f1f23;
    --danger: #f87171;
    --warning: #fbbf24;
    --modal-backdrop: rgba(0, 0, 0, 0.66);
    --shadow: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    letter-spacing: -0.006em;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .document-menu { position:fixed;z-index:200;min-width:200px;padding:5px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 28px #0003; }
  .document-menu button { display:block;width:100%;text-align:left;padding:8px;border:0;border-radius:4px;background:transparent;color:inherit;cursor:pointer; }
  .document-menu button:focus-visible,.document-menu button:hover { background:var(--accent-soft); }
  .document-menu button:disabled { opacity:.45;cursor:default; }
  .external-banner { display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--accent-soft);color:var(--text);font-size:12px; }
  .external-banner[hidden],.document-menu[hidden] { display:none; }
  .external-banner button,.comparison-actions button { background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer; }
  #external-comparison { width:min(1000px,94vw);max-height:90vh;box-sizing:border-box;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:20px; }
  #external-comparison::backdrop { background:#0007; }
  #external-comparison h2 { font-size:18px;margin:0 0 8px; }
  #external-comparison p { font-size:12px;overflow-wrap:anywhere; }
  .comparison-columns { display:flex;gap:12px; }
  .comparison-columns label { flex:1;min-width:0;font-size:13px; }
  .comparison-columns textarea { display:block;width:100%;height:45vh;margin-top:6px;box-sizing:border-box;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:10px;font:12px/1.6 monospace; }
  .comparison-actions { display:flex;justify-content:flex-end;gap:8px; }
  .asset-unavailable { outline:1px dashed var(--text-soft); }

  /* ── Top bar ─────────────────────────────────── */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .filename-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 0 1 auto;
  }
  #filename {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 3px 7px;
    min-width: 60px;
    max-width: 260px;
    width: 16ch;
    outline: none;
  }
  #filename:hover { border-color: var(--border); }
  #filename:focus { border-color: var(--accent); background: var(--panel); color: var(--text); }
  .dirty-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .dirty-dot.on { opacity: 1; }

  .spacer { flex: 1; }

  .seg {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
    flex: none;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-soft);
    padding: 3px 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { opacity: 0.9; }
  [data-theme="dark"] .btn.primary { color: #0b1120; }
  .btn.icon { padding: 5px 8px; }
  .btn svg { width: 14px; height: 14px; }
  kbd.hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 400;
  }
  .btn.primary kbd.hint { color: rgba(255,255,255,0.65); }
  [data-theme="dark"] .btn.primary kbd.hint { color: rgba(11,17,32,0.6); }

  /* ── Document tabs ─────────────────────────────── */
  #document-tabs-wrap {
    height: 36px;
    min-height: 36px;
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  #document-tabs {
    min-width: 0;
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
  }
  .document-tab {
    position: relative;
    display: flex;
    align-items: stretch;
    min-width: 118px;
    max-width: 240px;
    border-right: 1px solid var(--border-soft);
    color: var(--text-soft);
  }
  .document-tab.is-selected {
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 -2px var(--accent);
  }
  .document-tab.is-dragging { opacity: 0.55; }
  .document-tab.is-drop-target { box-shadow: inset 2px 0 var(--accent); }
  .document-tab[aria-busy="true"] { opacity: 0.65; }
  .document-tab > [role="tab"] {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border: 0;
    background: transparent;
    color: inherit;
    font: 500 12px var(--sans);
    text-align: left;
    padding: 0 4px 0 12px;
    cursor: pointer;
  }
  .document-tab > [role="tab"]:focus-visible,
  .document-tab-close:focus-visible,
  #btn-add-tab:focus-visible,
  #app-dialog button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .document-tab-name { overflow: hidden; text-overflow: ellipsis; }
  .document-tab.is-dirty .document-tab-name::after {
    content: " •";
    color: var(--accent);
  }
  .document-tab.is-conflict .document-tab-name::after {
    content: " !";
    color: var(--warning);
    font-weight: 700;
  }
  .document-tab-recovery {
    color: var(--danger);
    font-size: 10px;
    font-weight: 600;
    margin-left: 6px;
  }
  .document-tab-close {
    min-width: 32px;
    min-height: 32px;
    align-self: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-faint);
    font: 18px/1 var(--sans);
    cursor: pointer;
  }
  .document-tab-close:hover { background: var(--accent-soft); color: var(--text); }
  #btn-add-tab {
    width: 36px;
    min-width: 36px;
    border: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-soft);
    font: 20px/1 var(--sans);
    cursor: pointer;
  }
  #btn-add-tab:hover { background: var(--accent-soft); color: var(--accent); }
  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  /* ── Workspace dialog ─────────────────────────── */
  #dialog-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: var(--modal-backdrop);
  }
  #app-dialog {
    position: fixed;
    z-index: 91;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(460px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.25);
    padding: 20px;
  }
  #app-dialog h2 { font-size: 17px; line-height: 1.35; margin-bottom: 8px; }
  #dialog-message { color: var(--text-soft); line-height: 1.5; }
  #dialog-documents {
    margin: 14px 0 0 20px;
    color: var(--text-soft);
    font-family: var(--mono);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  #dialog-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  [hidden] { display: none !important; }

  /* ── Panes ───────────────────────────────────── */
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editor-pane, #preview-pane {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #editor-pane { border-right: 1px solid var(--border); }
  body[data-view="edit"] #preview-pane { display: none; }
  body[data-view="edit"] #editor-pane { border-right: none; }
  body[data-view="preview"] #editor-pane { display: none; }

  #editor-surfaces, .editor-surface {
    min-height: 0;
    flex: 1;
    display: flex;
  }
  #editor-surfaces {
    position: relative;
    min-width: 0;
  }
  .editor-surface {
    position: absolute;
    inset: 0;
    min-width: 0;
    contain: layout paint style;
    z-index: 1;
  }
  .editor-surface.is-inactive {
    z-index: 0;
    pointer-events: none;
  }
  #editor, .document-editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--panel);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 28px 32px 45vh;
    tab-size: 2;
  }
  #editor::placeholder, .document-editor::placeholder { color: var(--text-faint); }

  #preview-pane {
    overflow-y: auto;
    background: var(--bg);
  }
  #preview {
    max-width: var(--reader-width, 760px);
    width: 100%;
    margin: 0 auto;
    padding: 32px 40px 45vh;
    min-width: 0;
  }

  /* ── Table of contents (own column, right of the preview) ── */
  #toc {
    display: none;
    flex: none;
    width: 232px;
    min-height: 0;
    overflow-y: auto;
    background: var(--bg);
    border-left: 1px solid var(--border-soft);
    padding: 26px 16px 26px 6px;
    font-size: 12.5px;
  }
  body.toc-open #toc { display: block; }

  /* There is no room for a third column on a phone, so the contents becomes a
     slide-over drawer with a tap-anywhere backdrop. */
  #toc-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 69;
  }
  @media (max-width: 900px) {
    body.toc-open #toc {
      display: block;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(300px, 84vw);
      z-index: 70;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
      font-size: 14px;
      overscroll-behavior: contain;
    }
    body.toc-open #toc a { padding: 9px 10px; }   /* finger-sized tap targets */
    body.toc-open #toc-backdrop { display: block; }
  }

  /* Nothing to jump to while the preview is hidden — keep this last so it wins. */
  body[data-view="edit"] #toc, body[data-view="edit"] #toc-backdrop { display: none; }
  #toc .toc-title {
    font-weight: 600;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 0 0 8px 10px;
  }
  #toc .toc-empty { color: var(--text-faint); font-size: 12px; margin-left: 10px; }
  #toc a {
    display: block;
    color: var(--text-soft);
    text-decoration: none;
    padding: 3px 8px;
    border-left: 2px solid var(--border-soft);
    line-height: 1.45;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #toc a:hover { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); }
  #toc a.d2 { padding-left: 20px; }
  #toc a.d3 { padding-left: 32px; }
  #toc a.d4 { padding-left: 44px; }

  /* ── Rendered markdown ───────────────────────── */
  #preview { font-size: var(--reader-size, 14.5px); line-height: 1.65; color: var(--text); }
  #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.3;
    margin: 1.6em 0 0.55em;
  }
  #preview > :first-child { margin-top: 0; }
  #preview h1 { font-size: 1.75em; padding-bottom: 0.35em; border-bottom: 1px solid var(--border-soft); }
  #preview h2 { font-size: 1.35em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-soft); }
  #preview h3 { font-size: 1.15em; }
  #preview h4 { font-size: 1em; }
  #preview h5, #preview h6 { font-size: 0.9em; color: var(--text-soft); }
  #preview p, #preview ul, #preview ol, #preview blockquote, #preview pre, #preview table { margin: 0 0 0.9em; }
  #preview ul, #preview ol { padding-left: 1.6em; }
  #preview li { margin: 0.25em 0; }
  #preview li > ul, #preview li > ol { margin-bottom: 0; }
  #preview li.task { list-style: none; margin-left: -1.4em; }
  #preview li input[type="checkbox"] { margin-right: 0.45em; accent-color: var(--accent); vertical-align: -1px; }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview strong { font-weight: 600; }
  #preview code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 0.12em 0.35em;
  }
  #preview pre {
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  #preview pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
  #preview blockquote {
    border-left: 3px solid var(--border);
    padding: 0.1em 0 0.1em 1em;
    color: var(--text-soft);
  }
  #preview blockquote > :last-child { margin-bottom: 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  #preview img { max-width: 100%; border-radius: 8px; }
  #preview table { border-collapse: collapse; width: 100%; font-size: 0.95em; display: block; overflow-x: auto; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  #preview th { background: var(--code-bg); font-weight: 600; }
  #preview del { color: var(--text-faint); }

  /* ── GitHub callouts ─────────────────────────── */
  #preview blockquote.callout {
    border-left: 3px solid var(--co);
    border-radius: 0 8px 8px 0;
    background: var(--code-bg);
    padding: 11px 15px;
    color: var(--text);
  }
  #preview .callout-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 600;
    font-size: 0.92em;
    color: var(--co);
    margin-bottom: 5px;
  }
  #preview .callout-title svg { width: 15px; height: 15px; flex: none; }
  .callout-note      { --co: #2563eb; }
  .callout-tip       { --co: #16a34a; }
  .callout-important { --co: #9333ea; }
  .callout-warning   { --co: #d97706; }
  .callout-caution   { --co: #dc2626; }
  [data-theme="dark"] .callout-note      { --co: #60a5fa; }
  [data-theme="dark"] .callout-tip       { --co: #4ade80; }
  [data-theme="dark"] .callout-important { --co: #c084fc; }
  [data-theme="dark"] .callout-warning   { --co: #fbbf24; }
  [data-theme="dark"] .callout-caution   { --co: #f87171; }

  /* ── Syntax highlighting (github-flavored) ───── */
  .hljs { color: var(--text); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--text-faint); }
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag, .hljs-section, .hljs-template-tag, .hljs-deletion, .hljs-meta .hljs-keyword { color: #cf222e; }
  .hljs-title, .hljs-title.class_, .hljs-title.function_ { color: #8250df; }
  .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-number, .hljs-operator, .hljs-variable, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-selector-pseudo, .hljs-meta { color: #0550ae; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-meta .hljs-string { color: #116329; }
  .hljs-built_in, .hljs-symbol, .hljs-type { color: #953800; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }
  [data-theme="dark"] .hljs-keyword, [data-theme="dark"] .hljs-selector-tag, [data-theme="dark"] .hljs-doctag, [data-theme="dark"] .hljs-section, [data-theme="dark"] .hljs-template-tag, [data-theme="dark"] .hljs-deletion, [data-theme="dark"] .hljs-meta .hljs-keyword { color: #ff7b72; }
  [data-theme="dark"] .hljs-title, [data-theme="dark"] .hljs-title.class_, [data-theme="dark"] .hljs-title.function_ { color: #d2a8ff; }
  [data-theme="dark"] .hljs-attr, [data-theme="dark"] .hljs-attribute, [data-theme="dark"] .hljs-literal, [data-theme="dark"] .hljs-number, [data-theme="dark"] .hljs-operator, [data-theme="dark"] .hljs-variable, [data-theme="dark"] .hljs-selector-attr, [data-theme="dark"] .hljs-selector-class, [data-theme="dark"] .hljs-selector-id, [data-theme="dark"] .hljs-selector-pseudo, [data-theme="dark"] .hljs-meta { color: #79c0ff; }
  [data-theme="dark"] .hljs-string, [data-theme="dark"] .hljs-regexp, [data-theme="dark"] .hljs-addition, [data-theme="dark"] .hljs-meta .hljs-string { color: #a5d6ff; }
  [data-theme="dark"] .hljs-built_in, [data-theme="dark"] .hljs-symbol, [data-theme="dark"] .hljs-type { color: #ffa657; }

  /* ── Find & replace ──────────────────────────── */
  #find-bar {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  body.find-open #find-bar { display: flex; }
  body[data-view="preview"] #find-bar { display: none; }
  #find-bar input {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);

    min-width: 0;
    flex: 1 1 40%;
  }
  #find-bar input:focus { border-color: var(--accent); }
  #find-count {

  }
  #find-count.none { color: var(--danger); }
  #find-bar button {
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text-soft);
    cursor: pointer;
    flex: none;
  }
  #find-bar button:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Footnotes ───────────────────────────────── */
  #preview .fn-ref { font-size: 0.75em; line-height: 0; }
  #preview .fn-ref a { text-decoration: none; padding: 0 0.15em; }
  #preview .footnotes {
    margin-top: 2.4em;
    padding-top: 1em;
    border-top: 1px solid var(--border);
    font-size: 0.88em;
    color: var(--text-soft);
  }
  #preview .footnotes ol { padding-left: 1.3em; }
  #preview .footnotes li { margin: 0.35em 0; }
  #preview .footnotes li:target { background: var(--accent-soft); border-radius: 5px; }
  #preview .fn-back { text-decoration: none; margin-left: 0.3em; }

  /* ── Per-block download tools ────────────────── */
  .blk-tools {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 2;
  }
  .mermaid-block:hover .blk-tools, .table-wrap:hover .blk-tools,
  .code-wrap:hover .blk-tools, .blk-tools:focus-within { opacity: 1; }
  .blk-tools button {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-soft);
    cursor: pointer;
  }
  .blk-tools button:hover { color: var(--accent); border-color: var(--accent); }
  .table-wrap { position: relative; margin: 0 0 0.9em; }
  .table-wrap table { margin: 0; }
  .code-wrap { position: relative; margin: 0 0 0.9em; }
  .code-wrap pre { margin: 0; }

  /* ── Math & diagrams ─────────────────────────── */
  .katex-block { overflow-x: auto; margin: 0 0 0.9em; padding: 2px 0; }
  #preview .katex { font-size: 1.08em; }
  .math-err { color: var(--danger); font-family: var(--mono); font-size: 0.85em; }
  .mermaid-block { position: relative; margin: 0 0 0.9em; overflow-x: auto; text-align: center; }
  .mermaid-block svg { max-width: 100%; height: auto; }
  #preview pre.mermaid-err {
    text-align: left;
    border-color: var(--danger);
    white-space: pre-wrap;
    color: var(--text-soft);
    font-size: 12px;
  }

  /* ── Reader popover ──────────────────────────── */
  .popover-wrap { position: relative; display: inline-flex; flex: none; }
  .editor-panel {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 70;
    width: min(330px, calc(100vw - 24px)); padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--panel); color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,.14); font-size: 12px;
  }
  .editor-panel h2 { margin: 0 0 10px; font-size: 13px; }
  .editor-panel label { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .editor-panel input, .editor-panel select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 4px; border-radius: 4px; }
  .editor-panel input[type=number] { width: 64px; }
  .format-actions { display:flex; flex-wrap:wrap; gap:5px; }
  .editor-panel button { font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:5px 7px; cursor:pointer; }
  .editor-panel button:hover { background:var(--accent-soft); color:var(--accent); }
  .editor-gutter { position:relative; flex:none; width:42px; overflow:hidden; color:var(--text-soft); background:var(--panel); border-right:1px solid var(--border-soft); font-family:var(--mono); user-select:none; }
  #find-bar { flex-wrap:wrap; }
  #find-bar label { font-size:11px; color:var(--text-soft); white-space:nowrap; }
  #find-error { color:var(--text); width:100%; font-size:11px; }
  #find-error:empty { display:none; }
  #recent-pop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: min(380px, calc(100vw - 24px));
    max-height: min(480px, calc(100vh - 90px));
    overflow: auto;
    padding: 8px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    z-index: 65;
    font-size: 12px;
  }
  #recent-pop h2 { margin: 4px 8px 8px; font-size: 13px; }
  #recent-list { list-style: none; padding: 0; margin: 0; }
  #recent-list li { display: flex; align-items: center; gap: 4px; }
  #recent-pop button {
    background: transparent; color: var(--text); border: 0; border-radius: 6px;
    font: inherit; cursor: pointer; padding: 8px; text-align: left;
  }
  #recent-pop button:hover { background: var(--accent-soft); color: var(--accent); }
  #recent-pop button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #recent-pop button:disabled { opacity: 0.5; cursor: default; }
  .recent-open { min-width: 0; flex: 1; }
  .recent-name, .recent-folder { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-folder { color: var(--text-soft); font-size: 11px; margin-top: 3px; }
  #recent-pop .recent-remove { flex: none; font-size: 18px; }
  #recent-message { margin: 8px; overflow-wrap: anywhere; color: var(--text-soft); }
  #recent-message:empty { display: none; }
  #recent-pop #recent-clear { width: 100%; border-top: 1px solid var(--border-soft); margin-top: 4px; }
  #reader-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 12px 14px 14px;
    width: 224px;
    z-index: 60;
    display: none;
    font-size: 12px;
  }
  #reader-pop.on { display: block; }
  #reader-pop label { display: flex; justify-content: space-between; color: var(--text-soft); margin: 8px 0 5px; font-weight: 500; }
  #reader-pop label:first-child { margin-top: 0; }
  #reader-pop input[type="range"] { width: 100%; accent-color: var(--accent); }
  #reader-pop .widths { display: flex; gap: 4px; }
  #reader-pop .wbtn {
    flex: 1;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    font: inherit;
    font-size: 11px;
    padding: 4px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  #reader-pop .wbtn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn.toggled { border-color: var(--accent); color: var(--accent); }

  /* ── Help & support ──────────────────────────── */
  #help-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 14px 16px 15px;
    width: 310px;
    max-height: 70vh;
    overflow-y: auto;
    z-index: 60;
    display: none;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-soft);
    text-align: left;
    white-space: normal;
  }
  #help-pop.on { display: block; }
  #help-pop h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 600;
    margin: 14px 0 6px;
  }
  #help-pop h4:first-child { margin-top: 0; }
  #help-pop p { margin: 0 0 8px; }
  #help-pop a { color: var(--accent); text-decoration: none; font-weight: 500; }
  #help-pop a:hover { text-decoration: underline; }
  #help-pop .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; }
  #help-pop .keys kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  /* ── Equation palette ────────────────────────── */
  #eq-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 10px;
    width: 330px;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 60;
    display: none;
  }
  #eq-pop.on { display: block; }
  #eq-pop h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 600;
    margin: 10px 2px 6px;
  }
  #eq-pop h4:first-child { margin-top: 0; }
  #eq-pop .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  #eq-pop .grid button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    border: 1px solid var(--border-soft);
    background: var(--bg);
    border-radius: 7px;
    cursor: pointer;
    color: var(--text);
    padding: 2px;
    overflow: hidden;
  }
  #eq-pop .grid button:hover { border-color: var(--accent); background: var(--accent-soft); }
  #eq-pop .grid button .katex { font-size: 0.95em; }
  #eq-pop .hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
    line-height: 1.45;
  }

  /* ── Export menu ─────────────────────────────── */
  #export-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 4px;
    width: 216px;
    z-index: 60;
    display: none;
  }
  #export-pop.on { display: block; }
  #export-pop button {
    display: flex;
    align-items: baseline;
    gap: 7px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 7px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  #export-pop button:hover { background: var(--accent-soft); color: var(--accent); }
  #export-pop button:disabled { opacity: 0.5; cursor: default; }
  #export-pop button:disabled:hover { background: transparent; color: var(--text); }
  #export-pop .ext {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    margin-left: auto;
  }
  #export-pop .sep { height: 1px; background: var(--border-soft); margin: 4px 6px; }

  /* ── Status bar ──────────────────────────────── */
  footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 5px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  footer .spacer { flex: 1; }
  #status { color: var(--text-soft); font-family: var(--sans); }
  #document-details { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── Drop overlay ────────────────────────────── */
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #drop-overlay.on { display: flex; }
  #drop-overlay .card {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    background: var(--panel);
    padding: 42px 64px;
    text-align: center;
    color: var(--text);
    font-weight: 500;
  }
  #drop-overlay .card .sub { color: var(--text-soft); font-weight: 400; font-size: 12.5px; margin-top: 6px; }

  @media (max-width: 720px) {
    body[data-view="split"] main { flex-direction: column; }
    body[data-view="split"] #editor-pane { border-right: none; border-bottom: 1px solid var(--border); }
    .hide-sm { display: none; }
    #preview { padding: 20px 18px 40vh; }
    #editor, .document-editor { padding: 18px 18px 40vh; }
  }

  @media print {
    /* Always print on white — dark backgrounds waste ink and read badly. */
    :root, :root[data-theme="dark"], :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff; --panel: #ffffff; --text: #18181b; --text-soft: #52525b;
      --text-faint: #71717a; --border: #d4d4d8; --border-soft: #e4e4e7;
      --code-bg: #f6f6f7; --accent: #2563eb;
    }
    header, footer, #document-tabs-wrap, #dialog-backdrop, #app-dialog,
    #editor-pane, #drop-overlay, #toc, #reader-pop, #export-pop,
    .blk-tools { display: none !important; }
    html, body { height: auto; overflow: visible; display: block; }
    main { display: block; }
    #preview-pane { display: block !important; overflow: visible; }
    #preview { padding: 0; max-width: none; }
    #preview pre, #preview blockquote, #preview table, #preview img,
    .mermaid-block, .katex-block { break-inside: avoid; }
    #preview h1, #preview h2, #preview h3, #preview h4 { break-after: avoid; }
    @page { margin: 16mm; }
  }
</style>

<input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" multiple style="display:none">
