<script>/*__KATEX__*/</script>
<script>/*__MERMAID__*/</script>
<script>/*__DOCUMENT_MODEL__*/</script>
<script>/*__SESSION_MODEL__*/</script>
<script>/*__RECOVERY_SCHEDULER__*/</script>
<script>/*__SESSION_CONTROLLER__*/</script>
<script>/*__WORKSPACE_VIEW__*/</script>
<script>/*__NATIVE_BRIDGE__*/</script>
<script>/*__RECENT_DOCUMENTS__*/</script>
<script>/*__EDITOR_TOOLS__*/</script>
<script>/*__EDITOR_ENHANCEMENTS__*/</script>
<script>/*__DESKTOP_ASSETS__*/</script>
<script>/*__DESKTOP_WORKSPACE__*/</script>
<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const preview = $("preview"), previewPane = $("preview-pane");
  const filenameEl = $("filename"), dirtyDot = $("dirty-dot"), statusEl = $("status");
  const THEME_KEY = "mdedit-theme";
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
  $("save-kbd").textContent = isMac ? "⌘S" : "Ctrl+S";

  let controller = null;
  let resolveControllerReady;
  const controllerReady = new Promise((resolve) => { resolveControllerReady = resolve; });
  let workspaceView = null;
  const browserFileHandles = new Map();
  let statusTimer = null;
  let persistentRecoveryWarning = "";
  let nativeWindow = null;
  let pendingNativeTitle = null;
  let nativeTitleWrite = null;

  function updateWindowTitle(active) {
    const title = MDEdit.windowTitle(active);
    document.title = title;
    const windowApi = window.__TAURI__ && window.__TAURI__.window;
    if (!nativeApp || !windowApi || typeof windowApi.getCurrentWindow !== "function") return title;
    nativeWindow ||= windowApi.getCurrentWindow();
    if (!nativeWindow || typeof nativeWindow.setTitle !== "function") return title;
    pendingNativeTitle = title;
    if (!nativeTitleWrite) {
      nativeTitleWrite = (async () => {
        while (pendingNativeTitle !== null) {
          const nextTitle = pendingNativeTitle;
          pendingNativeTitle = null;
          try { await nativeWindow.setTitle(nextTitle); } catch (_) { /* document.title remains authoritative */ }
        }
      })().finally(() => { nativeTitleWrite = null; });
    }
    return title;
  }

  function activeEditor() {
    const active = controller && controller.activeDocument();
    return active && workspaceView ? workspaceView.editorFor(active.id) : null;
  }

  function isActiveEditorEvent(event) {
    const active = controller && controller.activeDocument();
    const surface = event && event.target;
    return Boolean(active && surface && surface.matches("textarea[data-document-id]")
      && surface.dataset.documentId === active.id
      && workspaceView && workspaceView.editorFor(active.id) === surface);
  }

  /* ── Markdown rendering ─────────────────────── */
  /* The lite build ships without KaTeX and Mermaid, so every use of them is
     feature-detected rather than assumed. One template, two builds. */
  const HAS_MATH = typeof katex !== "undefined";
  const HAS_DIAGRAMS = typeof mermaid !== "undefined";

  marked.use({ gfm: true, breaks: false });
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      // in-document jumps (footnotes) must stay in this page
      if ((node.getAttribute("href") || "").startsWith("#")) return;
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });


  /* ── Footnotes ───────────────────────────────────
     marked ships no footnote support, but [^1] references and their
     definitions are common in specs, papers and RFC-style docs. Definition
     bodies are rendered with a second, hook-free marked instance so this can
     never re-enter the main parse. */
  const markedPlain = new marked.Marked({ gfm: true });
  let fnDefs = new Map(), fnOrder = [];

  marked.use({
    hooks: {
      preprocess(src) {
        fnDefs = new Map();
        fnOrder = [];
        // "[^label]: body", continued by indented lines
        return src.replace(
          /^\[\^([^\]\n]+)\]:[ \t]*([^\n]*(?:\n(?:[ \t]{2,}|\t)[^\n]*)*)/gm,
          (_m, label, body) => {
            fnDefs.set(label.trim(), body.replace(/\n[ \t]+/g, "\n").trim());
            return "";
          }
        );
      },
      postprocess(html) {
        if (!fnOrder.length) return html;
        let out = '<section class="footnotes"><ol>';
        fnOrder.forEach((label, i) => {
          const n = i + 1;
          out += '<li id="fn-' + n + '">' + markedPlain.parseInline(fnDefs.get(label) || "") +
                 ' <a class="fn-back" href="#fnref-' + n + '" title="Back to text">↩</a></li>';
        });
        return html + out + '</ol></section>';
      },
    },
    extensions: [{
      name: "footnoteRef",
      level: "inline",
      start(src) { return src.indexOf("[^"); },
      tokenizer(src) {
        const m = /^\[\^([^\]\n]+)\]/.exec(src);
        if (!m) return;
        const label = m[1].trim();
        if (!fnDefs.has(label)) return;   // a reference with no definition stays literal text
        return { type: "footnoteRef", raw: m[0], label };
      },
      renderer(token) {
        let i = fnOrder.indexOf(token.label);
        if (i === -1) { fnOrder.push(token.label); i = fnOrder.length - 1; }
        const n = i + 1;
        return '<sup class="fn-ref" id="fnref-' + n + '"><a href="#fn-' + n + '">' + n + '</a></sup>';
      },
    }],
  });

  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  /* Math is pulled out BEFORE markdown parsing (marked would mangle _ and *
     inside TeX) and re-injected into the sanitized DOM afterwards. Private-use
     characters make placeholders that survive marked untouched. */
  const PH = (i) => "\uE000M" + i + "\uE001";
  function extractMath(src) {
    const math = [];
    const out = [];
    let inFence = false, fenceCh = "";
    let disp = null, dispPrefix = "";
    for (const rawLine of src.split("\n")) {
      let line = rawLine;
      if (disp) {
        const close = line.indexOf("$$");
        if (close === -1) { disp.push(line); continue; }
        disp.push(line.slice(0, close));
        math.push({ tex: disp.join("\n"), display: true });
        out.push(dispPrefix + PH(math.length - 1) + line.slice(close + 2));
        disp = null; dispPrefix = "";
        continue;
      }
      const fm = line.match(/^\s{0,3}(`{3,}|~{3,})/);
      if (fm) {
        if (!inFence) { inFence = true; fenceCh = fm[1][0]; }
        else if (fm[1][0] === fenceCh) inFence = false;
        out.push(line); continue;
      }
      if (inFence) { out.push(line); continue; }
      let res = "", j = 0, opened = false;
      while (j < line.length) {
        const c = line[j];
        if (c === "`") {
          let k = j; while (line[k] === "`") k++;
          const run = k - j;
          let m = k, close = -1;
          while (m < line.length) {
            if (line[m] === "`") { let m2 = m; while (line[m2] === "`") m2++; if (m2 - m === run) { close = m2; break; } m = m2; }
            else m++;
          }
          if (close !== -1) { res += line.slice(j, close); j = close; } else { res += line.slice(j, k); j = k; }
          continue;
        }
        if (c === "\\" && (line[j + 1] === "(" || line[j + 1] === "[")) {
          const closer = line[j + 1] === "(" ? "\\)" : "\\]";
          const end = line.indexOf(closer, j + 2);
          if (end !== -1) { math.push({ tex: line.slice(j + 2, end), display: line[j + 1] === "[" }); res += PH(math.length - 1); j = end + 2; continue; }
          res += c; j++; continue;
        }
        if (c === "$") {
          if (line[j + 1] === "$") {
            const end = line.indexOf("$$", j + 2);
            if (end !== -1) { math.push({ tex: line.slice(j + 2, end), display: true }); res += PH(math.length - 1); j = end + 2; continue; }
            disp = [line.slice(j + 2)]; dispPrefix = res; opened = true; break;
          }
          let end = -1;
          for (let m = j + 1; m < line.length; m++) {
            if (line[m] === "$") { if (line[m - 1] !== "\\" && line[m - 1] !== " " && m > j + 1) end = m; break; }
          }
          if (end !== -1 && line[j + 1] !== " ") {
            const tex = line.slice(j + 1, end);
            if (!/^[\d.,]*$/.test(tex)) { math.push({ tex, display: false }); res += PH(math.length - 1); j = end + 1; continue; }
          }
          res += c; j++; continue;
        }
        res += c; j++;
      }
      if (!opened) out.push(res);
    }
    if (disp) out.push(dispPrefix + "$$" + (disp.length ? "\n" : "") + disp.join("\n"));
    return { src: out.join("\n"), math };
  }

  function injectMath(mathList, rootElement = preview) {
    if (!mathList.length) return;
    const walker = document.createTreeWalker(rootElement, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) { if (n.nodeValue.indexOf("\uE000") !== -1) nodes.push(n); }
    for (const node of nodes) {
      if (node.parentElement && node.parentElement.closest("code, pre")) continue;
      const parts = node.nodeValue.split(/(\uE000M\d+\uE001)/);
      const frag = document.createDocumentFragment();
      for (const part of parts) {
        const m = part.match(/^\uE000M(\d+)\uE001$/);
        if (!m || !mathList[+m[1]]) { if (part) frag.appendChild(document.createTextNode(part)); continue; }
        const item = mathList[+m[1]];
        const holder = document.createElement(item.display ? "div" : "span");
        if (item.display) holder.className = "katex-block";
        let html;
        try { html = katex.renderToString(item.tex, { displayMode: item.display, throwOnError: false }); }
        catch (e) { html = '<span class="math-err">' + escapeHtml(item.tex) + "</span>"; }
        holder.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true, mathMl: true, svg: true } });
        frag.appendChild(holder);
      }
      node.parentNode.replaceChild(frag, node);
    }
  }

  /* GitHub-style callouts: > [!NOTE] etc. */
  const CALLOUT_META = {
    note:      ["Note",      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'],
    tip:       ["Tip",       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'],
    important: ["Important", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="12" y1="14" x2="12.01" y2="14"/></svg>'],
    warning:   ["Warning",   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'],
    caution:   ["Caution",   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'],
  };
  function transformCallouts(rootElement = preview) {
    rootElement.querySelectorAll("blockquote").forEach((bq) => {
      const p = bq.firstElementChild;
      if (!p || p.tagName !== "P" || !p.firstChild || p.firstChild.nodeType !== 3) return;
      const m = p.firstChild.nodeValue.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
      if (!m) return;
      const kind = m[1].toLowerCase();
      p.firstChild.nodeValue = p.firstChild.nodeValue.slice(m[0].length);
      if (!p.firstChild.nodeValue) p.firstChild.remove();
      if (p.firstChild && p.firstChild.nodeName === "BR") p.firstChild.remove();
      if (!p.hasChildNodes()) p.remove();
      bq.classList.add("callout", "callout-" + kind);
      const title = document.createElement("div");
      title.className = "callout-title";
      title.innerHTML = CALLOUT_META[kind][1] + CALLOUT_META[kind][0];
      bq.prepend(title);
    });
  }

  /* Code highlighting + mermaid diagrams */
  let mermaidSeq = 0;
  let mermaidPending = Promise.resolve();   // awaited by the PDF export
  let previewOwner = null;
  function initMermaid() {
    if (!HAS_DIAGRAMS) return;
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: theme === "dark" ? "dark" : "default",
      fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
    });
  }
  async function renderMermaidJobs(jobs, isCurrent = () => true, interactive = true) {
    let n = 0;
    for (const { div, src } of jobs) {
      const id = "mmd-" + (++mermaidSeq);
      n++;
      const index = n;
      try {
        const { svg } = await mermaid.render(id, src);
        if (!isCurrent()) continue;
        div.innerHTML = svg;
        const el = div.querySelector("svg");
        if (el && interactive) div.appendChild(toolButton("SVG", "Download this diagram as SVG", () => downloadDiagramSvg(el, index)));
      } catch (e) {
        const leftover = document.getElementById("d" + id);
        if (leftover) leftover.remove();
        const pre = document.createElement("pre");
        pre.className = "mermaid-err";
        pre.textContent = src + "\n\n⚠ " + ((e && e.message) || "Mermaid could not render this diagram");
        if (isCurrent()) div.replaceChildren(pre);
      }
    }
  }
  function highlightAndDiagrams(rootElement = preview, isCurrent = () => true, interactive = true) {
    rootElement.querySelectorAll("pre > code").forEach((code) => {
      const lang = (code.className.match(/language-([\w-]+)/) || [])[1];
      if (!lang || lang === "mermaid") return;
      if (hljs.getLanguage(lang)) {
        try {
          code.innerHTML = hljs.highlight(code.textContent, { language: lang }).value;
          code.classList.add("hljs");
        } catch (e) { /* leave plain */ }
      }
    });
    const jobs = [];
    if (!HAS_DIAGRAMS) return Promise.resolve();      // leave the fence as an ordinary code block
    rootElement.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid-block";
      const src = code.textContent;
      code.parentElement.replaceWith(div);
      jobs.push({ div, src });
    });
    return jobs.length ? renderMermaidJobs(jobs, isCurrent, interactive) : Promise.resolve();
  }

  /* Per-block downloads: a diagram as SVG, a table as CSV. */
  function toolButton(label, title, onClick) {
    const wrap = document.createElement("div");
    wrap.className = "blk-tools";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.title = title;
    b.addEventListener("click", onClick);
    wrap.appendChild(b);
    return wrap;
  }

  function downloadDiagramSvg(svg, n) {
    const exporting = controller.runCapturedExport("diagram " + n + " as SVG", async (capture, isCurrent) => {
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
      // mermaid emits width="100%" and sizes itself with CSS; a standalone file
      // needs real pixel dimensions, which the viewBox gives us intrinsically.
      const box = svg.getBoundingClientRect();
      const vb = (clone.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
      const w = vb.length === 4 && vb[2] ? vb[2] : box.width;
      const h = vb.length === 4 && vb[3] ? vb[3] : box.height;
      clone.setAttribute("width", Math.round(w));
      clone.setAttribute("height", Math.round(h));
      clone.style.maxWidth = "";
      const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
      if (!isCurrent()) throw new Error("the document changed before its diagram could be saved");
      const name = baseName(capture) + "-diagram-" + n + ".svg";
      await saveBlob(new Blob([text], { type: "image/svg+xml;charset=utf-8" }), name, capture, isCurrent);
      return { message: "Exported " + name };
    });
    exporting.catch(() => {});
    return exporting;
  }

  const csvCell = (s) => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
  function downloadTableCsv(table, n) {
    const exporting = controller.runCapturedExport("table " + n + " as CSV", async (capture, isCurrent) => {
      const rows = [...table.querySelectorAll("tr")].map((tr) =>
        [...tr.querySelectorAll("th, td")].map((c) => csvCell(c.textContent.trim())).join(",")
      );
      if (!isCurrent()) throw new Error("the document changed before its table could be saved");
      const name = baseName(capture) + "-table-" + n + ".csv";
      // the BOM makes Excel read it as UTF-8 rather than mangling accents
      await saveBlob(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }), name, capture, isCurrent);
      return { message: "Exported " + name + " (" + rows.length + " rows)" };
    });
    exporting.catch(() => {});
    return exporting;
  }

  async function copyCode(code, btn) {
    const text = code.textContent;
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      // the async clipboard needs a secure context; this keeps copy working from file://
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
    }
    btn.textContent = ok ? "Copied" : "Failed";
    setTimeout(() => { btn.textContent = "Copy"; }, 1400);
  }

  function addCodeTools(rootElement = preview) {
    rootElement.querySelectorAll("pre > code").forEach((code) => {
      const pre = code.parentElement;
      if (pre.parentElement && pre.parentElement.classList.contains("code-wrap")) return;
      const wrap = document.createElement("div");
      wrap.className = "code-wrap";
      pre.replaceWith(wrap);
      wrap.appendChild(pre);
      wrap.appendChild(toolButton("Copy", "Copy this code block",
        (e) => copyCode(code, e.currentTarget)));
    });
  }

  function addTableTools(rootElement = preview) {
    let n = 0;
    rootElement.querySelectorAll("table").forEach((table) => {
      n++;
      const index = n;
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.replaceWith(wrap);
      wrap.appendChild(table);
      wrap.appendChild(toolButton("CSV", "Download this table as CSV", () => downloadTableCsv(table, index)));
    });
  }

  /* Table of contents */
  const tocEl = $("toc");
  function buildToc(rootElement = preview) {
    const hs = rootElement.querySelectorAll("h1, h2, h3, h4");
    const used = new Set();
    let html = '<div class="toc-title">Contents</div>';
    hs.forEach((h) => {
      let id = h.textContent.trim().toLowerCase().replace(/[^\w\u00C0-\uFFFF]+/g, "-").replace(/^-+|-+$/g, "") || "section";
      while (used.has(id)) id += "-";
      used.add(id);
      h.id = id;
      html += '<a class="d' + h.tagName[1] + '" href="#' + id + '" data-id="' + id + '" title="' + escapeHtml(h.textContent) + '">' + escapeHtml(h.textContent) + "</a>";
    });
    if (!hs.length) html += '<div class="toc-empty">No headings yet</div>';
    tocEl.innerHTML = html;
  }

  function render(content, isCurrent = () => true, rootElement = preview, interactive = true, documentPath = null) {
    const { src, math } = HAS_MATH ? extractMath(content) : { src: content, math: [] };
    rootElement.innerHTML = DOMPurify.sanitize(marked.parse(src));
    if (HAS_MATH) injectMath(math, rootElement);
    transformCallouts(rootElement);
    const diagrams = highlightAndDiagrams(rootElement, isCurrent, interactive);
    // mark task-list items so CSS can drop their bullets
    rootElement.querySelectorAll('li > input[type="checkbox"]').forEach((cb) => {
      cb.closest("li").classList.add("task");
    });
    if (interactive) {
      addTableTools(rootElement);
      addCodeTools(rootElement);
      buildToc(rootElement);
      updateStats(content);
    }
    return Promise.resolve(diagrams).then(() => desktopAssets && desktopAssets.hydrate(rootElement, documentPath, isCurrent, !interactive));
  }

  async function renderForExport(capture) {
    const isolated = document.createElement("article");
    const owned = () => controller.isDocumentCaptureCurrent(capture);
    await render(capture.content, owned, isolated, false, capture.path);
    if (!owned()) throw new Error("the document changed before its export could be rendered");
    return isolated.innerHTML;
  }

  function updateStats(text) {
    const words = (text.trim().match(/\S+/g) || []).length;
    $("stat-words").textContent = words + " word" + (words === 1 ? "" : "s");
    $("stat-chars").textContent = text.length + " chars";
    const lines = text.length ? text.split("\n").length : 1;
    $("stat-lines").textContent = lines + " line" + (lines === 1 ? "" : "s");
  }

  let activeStatsToken = 0;
  let activeStatsTimer = null;
  function scheduleActiveDocumentStats(documentId, content) {
    const token = ++activeStatsToken;
    if (activeStatsTimer !== null) clearTimeout(activeStatsTimer);
    activeStatsTimer = setTimeout(() => {
      activeStatsTimer = null;
      requestAnimationFrame(() => {
        const active = controller && controller.activeDocument();
        if (token !== activeStatsToken || !active || active.id !== documentId || active.content !== content) return;
        updateStats(content);
      });
    }, 150);
  }

  function setStatus(msg, sticky, documentId) {
    const id = documentId || (controller && controller.activeDocument() && controller.activeDocument().id);
    if (id && workspaceView) workspaceView.setDocumentStatus(id, { status: sticky ? "writing" : "message", message: msg });
    statusEl.textContent = [persistentRecoveryWarning, msg].filter(Boolean).join(" · ");
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => { statusEl.textContent = persistentRecoveryWarning; }, 4000);
  }

  function setDirty(v) {
    const active = controller && controller.activeDocument();
    const surface = activeEditor();
    if (active && surface && v && active.content !== surface.value) controller.onEditorInput(active.id, surface.value);
    if (active) active.dirty = Boolean(v);
    dirtyDot.classList.toggle("on", v);
  }

  /* ── File loading ───────────────────────────── */
  function isSupportedFile(file) {
    if (!file || typeof file.name !== "string") return false;
    return /\.(md|markdown|mdown|mkd|txt)$/i.test(file.name)
      || file.type === "text/markdown" || file.type === "text/plain";
  }

  async function openBrowserFiles(files, handles = []) {
    const acceptedBatch = (async () => {
      const suppliedFiles = Array.from((await files) || []);
      const suppliedHandles = Array.from((await handles) || []);
      const accepted = [];
      const sourceKeys = [];
      const acceptedIndexes = [];
      suppliedFiles.forEach((file, index) => {
        if (!isSupportedFile(file)) return;
        accepted.push(file);
        sourceKeys.push(suppliedHandles[index] || file);
        acceptedIndexes.push(index);
      });
      return { suppliedFiles, suppliedHandles, accepted, sourceKeys, acceptedIndexes };
    })();
    const result = await controller.openBrowserFiles(
      acceptedBatch.then((batch) => batch.accepted),
      acceptedBatch.then((batch) => batch.sourceKeys),
    );
    const batch = await acceptedBatch;
    result.results.forEach((outcome, index) => {
      const handle = batch.sourceKeys[index];
      if (outcome.document && !outcome.reserved && handle && handle !== outcome.file) {
        browserFileHandles.set(outcome.id, handle);
      }
    });
    const acceptedByIndex = new Map(batch.acceptedIndexes.map(
      (inputIndex, index) => [inputIndex, result.results[index]],
    ));
    const results = batch.suppliedFiles.map((file, index) => {
      if (acceptedByIndex.has(index)) return acceptedByIndex.get(index);
      const error = new Error("Unsupported file type");
      return {
        file,
        handle: batch.suppliedHandles[index] || null,
        document: null,
        id: null,
        existing: false,
        error,
        name: file && file.name ? file.name : "browser file",
      };
    });
    const unsupported = results.filter((outcome) => outcome.error && /Unsupported file type/.test(outcome.error.message));
    syncActiveSurface();
    const active = controller.activeDocument();
    if (active && result.opened.length) {
      setStatus("Opened " + active.displayName
        + (browserFileHandles.has(active.id) ? " — Save writes back to the original file" : ""), false, active.id);
    }
    return { ...result, failed: [...result.failed, ...unsupported], results };
  }

  async function openPicker() {
    if (nativeApp) {
      const paths = await nativeApp.pickFiles();
      const result = paths.length ? await controller.openPaths(paths) : null;
      syncActiveSurface();
      if (result && result.failed.length) {
        const message = `Opened ${result.opened.length} files; Failed: ${result.failed.map(({ path }) => path).join(", ")}`;
        requestAnimationFrame(() => requestAnimationFrame(() => setStatus(message)));
      }
      return;
    }
    if (window.showOpenFilePicker) {
      let handles;
      try {
        handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd"], "text/plain": [".txt"] } }],
          excludeAcceptAllOption: false,
        });
      } catch (error) {
        if (error && error.name === "AbortError") return;
        setStatus("Could not open files — " + (error.message || "unknown error"));
        return;
      }
      if (!handles || !handles.length) return;
      const result = await MDEdit.openLaunchFiles(
        handles,
        openBrowserFiles,
        (error) => setStatus("Could not open that file — " + (error.message || "unknown error")),
      );
      const failures = result.results.filter((outcome) => outcome.error);
      if (failures.length) {
        const openedCount = result.results.length - failures.length;
        const names = failures.map((outcome) => outcome.name
          || (outcome.handle && outcome.handle.name)
          || (outcome.file && outcome.file.name) || "browser file");
        setStatus(`Opened ${openedCount} files; Failed: ${names.join(", ")}`);
      }
    } else {
      $("file-input").click();
    }
  }
  $("file-input").addEventListener("change", async (e) => {
    await openBrowserFiles(e.target.files || []);
    e.target.value = "";
  });

  /* ── Saving ─────────────────────────────────── */
  async function writeToHandle(handle, content) {
    const writable = await handle.createWritable();
    await writable.write(content);
    await writable.close();
  }

  async function readBrowserHandle(handle) {
    const file = await handle.getFile();
    const content = String(await file.text()).replace(/\r\n/g, "\n");
    return { file, content, sha256: await hashText(content) };
  }

  async function browserSaveDocumentStrategy({ document, capture, saveBrowser }) {
    const fileHandle = browserFileHandles.get(document.id);
    if (!fileHandle) return saveAs(capture);
    try {
      if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
        if ((await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("denied");
      }
      return await saveBrowser({
        read: () => readBrowserHandle(fileHandle),
        write: (content) => writeToHandle(fileHandle, content),
        saveAs: (conflictCapture) => saveAs(conflictCapture),
      });
    } catch (error) {
      setStatus("Couldn't save " + capture.displayName + " — " + error.message, false, capture.documentId);
      return { saved: false, error, documentId: capture.documentId };
    }
  }

  async function save() {
    const document = controller.activeDocument();
    if (!document) return;
    const capture = controller.captureActiveDocument();
    try {
      const result = await controller.saveDocument(document.id);
      syncActiveSurface();
      if (result && result.saved) setStatus("Saved to " + document.displayName, false, document.id);
      return result;
    } catch (e) {
      setStatus("Couldn't save " + capture.displayName + " — " + e.message, false, capture.documentId);
      return null;
    }
  }

  async function saveAllDocuments() {
    const button = $("btn-save-all");
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    try {
      const result = await controller.saveAll();
      const remaining = result.remainingIds.map((id) => controller.session.documents.get(id)).filter(Boolean);
      const savedCount = result.savedIds.length;
      if (remaining.length) {
        const prefix = result.canceled ? "Save All canceled" : "Save All stopped";
        setStatus(`${prefix} after ${savedCount} saved; ${remaining.length} remain unsaved: ${remaining.map((doc) => doc.displayName).join(", ")}`);
      } else {
        setStatus(`Saved ${savedCount} document${savedCount === 1 ? "" : "s"}`);
      }
      return result;
    } catch (error) {
      setStatus("Save All failed — " + error.message);
      return null;
    } finally {
      button.removeAttribute("aria-busy");
      syncActiveSurface();
    }
  }

  // Directory of the document as the shell knows it ("" when unknown):
  // Save-As and exports anchor their dialogs there instead of the app's cwd.
  const nativeDir = (document = controller.activeDocument()) => (document && document.path ? document.path.replace(/[^/\\]*$/, "") : "");

  async function saveAs(capture) {
    capture = capture || controller.captureActiveDocument();
    const document = capture.document;
    if (!document || !controller.session.documents.has(capture.documentId)) return;
    if (nativeApp) {
      try {
        const result = await controller.saveAs(capture.documentId);
        if (!result || !result.saved) return result;
        browserFileHandles.delete(capture.documentId);
        syncActiveSurface();
        setStatus("Saved to " + document.displayName, false, document.id);
        return result;
      } catch (e) {
        setStatus("Couldn't save: " + e.message, false, capture.documentId);
      }
      return;
    }
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: capture.displayName || "untitled.md",
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }],
        });
        const source = await controller.reserveBrowserSource(capture.documentId, handle);
        if (!source.reserved) {
          syncActiveSurface();
          setStatus("That file is already open in " + (source.document ? source.document.displayName : "another tab"));
          return source;
        }
        let currentFile = null;
        try {
          await writeToHandle(handle, capture.content);
          try { currentFile = await handle.getFile(); } catch (_) { /* handle identity is sufficient */ }
          document.updateMetadata({ displayName: handle.name });
          await controller.commitBrowserSourceReservation(source.reservation, currentFile);
        } catch (error) {
          await controller.releaseBrowserSourceReservation(source.reservation).catch(() => {});
          throw error;
        }
        browserFileHandles.set(capture.documentId, handle);
        const contentSha256 = await hashText(capture.content);
        controller.recordCapturedSave(capture, { contentSha256, diskSha256: contentSha256 });
        syncActiveSurface();
        setStatus("Saved to " + handle.name, false, document.id);
        return { saved: true, documentId: capture.documentId, handle };
      } catch (e) {
        if (e && e.name === "AbortError") return { saved: false, canceled: true, documentId: capture.documentId };
        setStatus("Couldn't save " + capture.displayName + " — " + e.message, false, capture.documentId);
        return { saved: false, error: e, documentId: capture.documentId };
      }
    } else {
      return downloadAsSave(capture);
    }
  }

  async function saveBlob(blob, name, capture, isCurrent = () => true) {
    if (nativeApp) {
      const data = new Uint8Array(await blob.arrayBuffer());
      if (!isCurrent()) throw new Error("the document changed before the export could be saved");
      const path = await nativeApp.chooseSavePath({
        defaultDir: nativeDir(capture),
        suggestedName: name,
      });
      if (!path) return false;
      if (!isCurrent()) throw new Error("the document changed before the export could be saved");
      await nativeApp.writeFile(path, data);
      return true;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return true;
  }

  const baseName = (capture) => ((capture && capture.displayName) || "untitled.md").replace(/\.[^.]+$/, "") || "untitled";

  async function download(capture) {
    capture = capture || captureActiveDocument("md");
    const name = capture.displayName || "untitled.md";
    await saveBlob(new Blob([capture.content], { type: "text/markdown;charset=utf-8" }), name, capture);
    return { message: (nativeApp ? "Saved " : "Downloaded ") + name };
  }

  async function downloadAsSave(capture) {
    await download(capture);
    const contentSha256 = await hashText(capture.content);
    controller.recordCapturedSave(capture, { contentSha256, diskSha256: contentSha256 });
    syncActiveSurface();
    setStatus("Saved " + capture.displayName, false, capture.documentId);
    return { saved: true, documentId: capture.documentId, downloaded: true };
  }

  /* ── Exports ────────────────────────────────── */
  const pageStyles = () => [...document.querySelectorAll("style")].map((s) => s.textContent).join("\n");

  // Undo the app-shell layout so the exported document is a plain scrolling page.
  const EXPORT_RESET =
    "html,body{height:auto;overflow:visible;display:block}" +
    "body{background:var(--bg);padding:40px 24px}" +
    "#preview{margin:0 auto;padding:0}";

  // Build an export-only tree from HTML rendered for the captured document.
  function cleanPreviewClone(capture) {
    if (!capture || typeof capture.renderedHtml !== "string" || !capture.renderedHtml) {
      throw new Error("captured export HTML is unavailable");
    }
    const clone = document.createElement("article");
    clone.id = "preview";
    clone.innerHTML = capture.renderedHtml;
    return clone;
  }

  async function exportHtml(capture) {
    capture = capture || captureActiveDocument("html");
    const clone = cleanPreviewClone(capture);
    const title = (clone.querySelector("h1") || {}).textContent || baseName(capture);
    const doc =
      '<!DOCTYPE html>\n<html lang="en" data-theme="' + theme + '">\n<head>\n' +
      '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>" + escapeHtml(title.trim()) + "</title>\n" +
      "<style>" + pageStyles() + "</style>\n<style>" + EXPORT_RESET + "</style>\n" +
      '</head>\n<body>\n<article id="preview">\n' +
      clone.innerHTML +
      "\n</article>\n</body>\n</html>\n";
    const name = baseName(capture) + ".html";
    await saveBlob(new Blob([doc], { type: "text/html;charset=utf-8" }), name, capture);
    return { message: "Exported " + name + " — self-contained, opens anywhere" };
  }

  /* PNG: serialize the preview into an SVG <foreignObject> and paint that onto a
     canvas. Everything happens in-page; remote images can't load inside an SVG
     used as an image, so they come out blank (data: URIs are fine). */
  async function exportPng(capture) {
    capture = capture || captureActiveDocument("png");
    const P = 36;
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;left:-20000px;top:0;";
    const clone = cleanPreviewClone(capture);
    const width = 760;
    clone.setAttribute("style", "padding:0;margin:0;max-width:none;width:" + width + "px");
    holder.appendChild(clone);
    document.body.appendChild(holder);
    try {
      await Promise.all([...clone.querySelectorAll('img[src^="data:"]')].map(img => img.decode()));
      const height = Math.ceil(clone.getBoundingClientRect().height);
      const W = width + P * 2, H = height + P * 2;
      if (H > 16000) {
        throw new Error("This document is too tall for a PNG — use Print / Save as PDF instead");
      }
      // There is no <html>/<body> inside a foreignObject, so the theme attribute and
      // the font/letter-spacing that normally come from <body> are set on the wrapper.
      const bodyCss = getComputedStyle(document.body);
      const bg = bodyCss.backgroundColor || "#ffffff";
      const wrapStyle = "font-family:" + bodyCss.fontFamily + ";letter-spacing:" + bodyCss.letterSpacing + ";";
      const body =
        '<div xmlns="http://www.w3.org/1999/xhtml" data-theme="' + theme + '" style="' + escapeHtml(wrapStyle) + '">' +
        "<style><![CDATA[" + pageStyles() +
        // a scrollbar painted into a still image is just noise
        "*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}]]></style>" +
        new XMLSerializer().serializeToString(clone) + "</div>";
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
        '<rect width="100%" height="100%" fill="' + bg + '"/>' +
        '<foreignObject x="' + P + '" y="' + P + '" width="' + width + '" height="' + height + '">' +
        body + "</foreignObject></svg>";

      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("the browser could not rasterize this document"));
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      });
      const scale = H * (window.devicePixelRatio || 1) > 16000 ? 1 : Math.min(2, window.devicePixelRatio || 1);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(H * scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("the image could not be encoded");
      const name = baseName(capture) + ".png";
      await saveBlob(blob, name, capture);
      return { message: "Exported " + name + " (" + canvas.width + "×" + canvas.height + ")" };
    } catch (e) {
      throw new Error("PNG export failed — " + (e.message || "unknown error") + ". Try Print / Save as PDF.");
    } finally {
      holder.remove();
    }
  }

  /* PDF: the browser's own print-to-PDF, which yields real selectable text.
     Mermaid bakes theme colors into its SVG, so print from the light theme. */
  async function exportPdf(capture) {
    capture = capture || captureActiveDocument("pdf");
    const wasDark = theme === "dark";
    const restoreTheme = () => {
      window.removeEventListener("afterprint", restoreTheme);
      if (wasDark) setTheme("dark", false);
    };
    try {
      if (wasDark) setTheme("light", false);
      desktopAssets?.clearCache();
      await controller.renderDocument(capture.documentId, { renderWhenHidden: true, force: true });
      if (desktopAssets) await desktopAssets.hydrate(preview, capture.path, () => controller.canPrintCapture(capture, previewOwner), true);
      if (!controller.canPrintCapture(capture, previewOwner)) {
        throw new Error("PDF export canceled because the active document changed before printing");
      }
      setStatus('Choose "Save as PDF" as the destination in the print dialog', true, capture.documentId);
      if (wasDark) window.addEventListener("afterprint", restoreTheme, { once: true });
      window.print();
      return { message: `Print dialog opened for ${capture.displayName}` };
    } catch (error) {
      restoreTheme();
      throw error;
    }
  }

  /* ── New document ───────────────────────────── */
  function newDoc() {
    controller.createUntitled();
    syncActiveSurface();
  }

  /* ── Drag & drop ────────────────────────────── */
  const overlay = $("drop-overlay");
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
      dragDepth++;
      overlay.classList.add("on");
    }
  });
  window.addEventListener("dragleave", () => {
    if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove("on"); }
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove("on");
    const files = [];
    const handles = [];
    const items = Array.from((e.dataTransfer && e.dataTransfer.items) || []);
    if (items.length) {
      for (const item of items) {
        if (!item || item.kind !== "file") continue;
        let file = null;
        let handle = null;
        if (item.getAsFileSystemHandle) {
          try {
            handle = await item.getAsFileSystemHandle();
            if (handle && handle.kind === "file") file = await handle.getFile();
            else handle = null;
          } catch (err) { handle = null; }
        }
        if (!file && item.getAsFile) file = item.getAsFile();
        if (file) {
          files.push(file);
          handles.push(handle);
        }
      }
    } else {
      for (const file of (e.dataTransfer && e.dataTransfer.files) || []) {
        files.push(file);
        handles.push(null);
      }
    }
    await openBrowserFiles(files, handles);
  });

  /* ── Editor behaviour ───────────────────────── */
  /* Tab / Shift+Tab indent and outdent.
     Everything goes through execCommand("insertText") rather than setRangeText:
     it is deprecated, but it is the only way to write into a textarea that the
     browser records on its own undo stack, so Ctrl/Cmd+Z still works. */
  let desktopAssets = null, desktopWorkspace = null;
  let editorEnhancements = null;
  const indentText = () => " ".repeat(editorEnhancements ? editorEnhancements.tabWidth() : 2);
  function keyboardEvent(event) {
    return {
      key: event.key,
      ctrlKey: event.ctrlKey,
      metaKey: event.metaKey,
      altKey: event.altKey,
      shiftKey: event.shiftKey,
      repeat: event.repeat,
      isMac,
    };
  }

  function keyboardCommand(event) {
    return MDEdit.commandForKey(keyboardEvent(event));
  }

  function shortcutFocusOptions(event) {
    const target = event && event.target;
    const tabFocused = Boolean(target && $("document-tabs").contains(target));
    return {
      focusEditor: isActiveEditorEvent(event),
      preserveTabFocus: tabFocused,
    };
  }

  async function runTabCommand(command, event) {
    const active = controller && controller.activeDocument();
    if (!active) return;
    const focusOptions = shortcutFocusOptions(event);
    if (command === "next-tab") controller.activateAdjacentDocument(1, focusOptions);
    else if (command === "previous-tab") controller.activateAdjacentDocument(-1, focusOptions);
    else if (command === "move-tab-left") controller.moveActiveDocument(-1);
    else if (command === "move-tab-right") controller.moveActiveDocument(1);
    else if (command === "close-tab") {
      const result = await controller.closeDocument(active.id);
      if (result && result.closed) browserFileHandles.delete(active.id);
    }
    syncActiveSurface();
    if (command === "close-tab" && focusOptions.preserveTabFocus) {
      requestAnimationFrame(() => workspaceView.focusActiveTab());
    }
  }

  function replaceRange(surface, start, end, text) {
    surface.focus();
    surface.setSelectionRange(start, end);
    let ok = false;
    try { ok = document.execCommand("insertText", false, text); } catch (err) { ok = false; }
    if (!ok) {                       // no native undo here, but never lose the edit
      surface.setRangeText(text, start, end, "end");
      surface.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  // the full lines touched by the current selection
  function selectedLines(surface) {
    const v = surface.value;
    const start = v.lastIndexOf("\n", surface.selectionStart - 1) + 1;
    let end = v.indexOf("\n", surface.selectionEnd);
    if (end === -1) end = v.length;
    return { start, end, text: v.slice(start, end) };
  }

  function shiftLines(surface, outdent) {
    const { start, end, text } = selectedLines(surface);
    const from = surface.selectionStart, to = surface.selectionEnd;
    let firstDelta = 0, totalDelta = 0;
    const out = text.split("\n").map((line, i) => {
      let delta;
      if (outdent) {
        const lead = (line.match(new RegExp("^(\\t| {1," + indentText().length + "})")) || [""])[0];
        delta = -lead.length;
        line = line.slice(lead.length);
      } else {
        delta = line.length ? indentText().length : 0;   // don't indent blank lines
        if (delta) line = indentText() + line;
      }
      if (i === 0) firstDelta = delta;
      totalDelta += delta;
      return line;
    }).join("\n");

    if (out === text) return;
    replaceRange(surface, start, end, out);
    surface.setSelectionRange(Math.max(start, from + firstDelta), Math.max(start, to + totalDelta));
  }

  $("editor-surfaces").addEventListener("keydown", (e) => {
    if (!isActiveEditorEvent(e)) return;
    const command = keyboardCommand(e);
    if (command) {
      e.preventDefault();
      e.stopPropagation();
      runTabCommand(command, e).catch((error) => setStatus(error.message));
      return;
    }
    if (e.repeat && MDEdit.isTabCommandKey(keyboardEvent(e))) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    const surface = e.target;
    if (e.key !== "Tab" || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    const spansLines = surface.value.slice(surface.selectionStart, surface.selectionEnd).includes("\n");
    if (e.shiftKey) shiftLines(surface, true);          // Shift+Tab always outdents
    else if (spansLines) shiftLines(surface, false);    // indent every line of a block
    else replaceRange(surface, surface.selectionStart, surface.selectionEnd, indentText());
  });

  // proportional scroll sync: editor → preview
  $("editor-surfaces").addEventListener("scroll", (event) => {
    if (!isActiveEditorEvent(event)) return;
    const surface = event.target;
    if (document.body.dataset.view !== "split") return;
    const eMax = surface.scrollHeight - surface.clientHeight;
    const pMax = previewPane.scrollHeight - previewPane.clientHeight;
    if (eMax > 0 && pMax > 0) previewPane.scrollTop = (surface.scrollTop / eMax) * pMax;
  }, true);

  filenameEl.addEventListener("change", () => {
    let name = filenameEl.value.trim() || "untitled.md";
    if (!/\.(md|markdown|mdown|mkd|txt)$/i.test(name)) name += ".md";
    filenameEl.value = name;
    const active = controller.activeDocument();
    if (!active) return;
    active.updateMetadata({ displayName: name, path: null, canonicalPath: null });
    controller.checkpointDocument(active.id, "rename-checkpoint");
    browserFileHandles.delete(active.id);
    controller.activateDocument(active.id);
    syncActiveSurface();
  });
  filenameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") filenameEl.blur(); });

  /* ── TOC toggle ─────────────────────────────── */
  const TOC_KEY = "mdedit-toc";
  const isDrawer = () => matchMedia("(max-width: 900px)").matches;   // contents panel has no room
  const isPhone  = () => matchMedia("(max-width: 720px)").matches;   // side-by-side is unreadable

  function setToc(on) {
    document.body.classList.toggle("toc-open", on);
    $("btn-toc").classList.toggle("toggled", on);
  }
  $("btn-toc").addEventListener("click", (e) => {
    e.stopPropagation();
    const on = !document.body.classList.contains("toc-open");
    setToc(on);
    try { localStorage.setItem(TOC_KEY, on ? "1" : "0"); } catch (e2) {}
  });
  // Don't restore an open contents panel on a phone — it would cover the page on load.
  try {
    if (localStorage.getItem(TOC_KEY) === "1" && !isDrawer()) setToc(true);
  } catch (e) {}

  $("toc-backdrop").addEventListener("click", () => setToc(false));

  preview.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#fn"]');
    if (!a) return;
    e.preventDefault();
    const target = document.getElementById(a.getAttribute("href").slice(1));

  /* ── Reader controls ────────────────────────── */

  /* ── Help ─────────────────────────────────────── */

  /* ── Equation palette ───────────────────────────
     A grid of common TeX templates, each button rendered with KaTeX so you
     pick the shape you want rather than recalling the syntax. CARET marks where
     the caret lands after inserting. */
  const CARET = "\uE010";   // a private-use char: it can never collide with LaTeX (a literal "^" can)
  const EQ_GROUPS = [
    ["Structures", [
      ["\\frac{a}{b}", "\\frac{\uE010}{}"],
      ["\\sqrt{x}", "\\sqrt{\uE010}"],
      ["\\sqrt[n]{x}", "\\sqrt[\uE010]{}"],
      ["x^{n}", "^{\uE010}"],
      ["x_{i}", "_{\uE010}"],
      ["x_{i}^{n}", "_{\uE010}^{}"],
      ["\\sum_{i=1}^{n}", "\\sum_{\uE010}^{}"],
      ["\\prod_{i=1}^{n}", "\\prod_{\uE010}^{}"],
      ["\\int_{a}^{b}", "\\int_{\uE010}^{}"],
      ["\\iint", "\\iint \uE010"],
      ["\\oint", "\\oint \uE010"],
      ["\\lim_{x \\to 0}", "\\lim_{\uE010 \\to }"],
      ["\\binom{n}{k}", "\\binom{\uE010}{}"],
      ["\\overline{x}", "\\overline{\uE010}"],
      ["\\vec{v}", "\\vec{\uE010}"],
      ["\\hat{x}", "\\hat{\uE010}"],
      ["\\dot{x}", "\\dot{\uE010}"],
      ["|x|", "\\left| \uE010 \\right|"],
      ["\\begin{matrix} a & b \\\\ c & d \\end{matrix}", "\\begin{matrix} \uE010 & \\\\ & \\end{matrix}"],
      ["\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}", "\\begin{pmatrix} \uE010 & \\\\ & \\end{pmatrix}"],
      ["\\begin{cases} a \\\\ b \\end{cases}", "\\begin{cases} \uE010 \\\\ \\end{cases}"],
    ]],
    ["Greek", [
      ["\\alpha", "\\alpha "], ["\\beta", "\\beta "], ["\\gamma", "\\gamma "], ["\\delta", "\\delta "],
      ["\\epsilon", "\\epsilon "], ["\\zeta", "\\zeta "], ["\\eta", "\\eta "], ["\\theta", "\\theta "],
      ["\\lambda", "\\lambda "], ["\\mu", "\\mu "], ["\\pi", "\\pi "], ["\\rho", "\\rho "],
      ["\\sigma", "\\sigma "], ["\\tau", "\\tau "], ["\\phi", "\\phi "], ["\\chi", "\\chi "],
      ["\\psi", "\\psi "], ["\\omega", "\\omega "], ["\\Gamma", "\\Gamma "], ["\\Delta", "\\Delta "],
      ["\\Theta", "\\Theta "], ["\\Lambda", "\\Lambda "], ["\\Sigma", "\\Sigma "], ["\\Omega", "\\Omega "],
    ]],
    ["Relations & operators", [
      ["\\times", "\\times "], ["\\div", "\\div "], ["\\pm", "\\pm "], ["\\cdot", "\\cdot "],
      ["\\leq", "\\leq "], ["\\geq", "\\geq "], ["\\neq", "\\neq "], ["\\approx", "\\approx "],
      ["\\equiv", "\\equiv "], ["\\propto", "\\propto "], ["\\in", "\\in "], ["\\notin", "\\notin "],
      ["\\subset", "\\subset "], ["\\cup", "\\cup "], ["\\cap", "\\cap "], ["\\forall", "\\forall "],
      ["\\exists", "\\exists "], ["\\nabla", "\\nabla "], ["\\partial", "\\partial "], ["\\infty", "\\infty "],
      ["\\to", "\\to "], ["\\Rightarrow", "\\Rightarrow "], ["\\Leftrightarrow", "\\Leftrightarrow "], ["\\therefore", "\\therefore "],
    ]],
  ];

  const eqPop = $("eq-pop");
  function buildPalette() {
    let html = "";
    for (const [title, items] of EQ_GROUPS) {
      html += "<h4>" + title + "</h4><div class='grid'>";
      for (let i = 0; i < items.length; i++) {
        let face;
        try { face = katex.renderToString(items[i][0], { throwOnError: false }); }
        catch (e) { face = escapeHtml(items[i][0]); }
        html += "<button type='button' data-tex='" + escapeHtml(items[i][1]) + "' title='" +
                escapeHtml(items[i][0]) + "'>" + face + "</button>";
      }
      html += "</div>";
    }
    html += "<div class='hint'>Inserts LaTeX at the cursor and wraps it in <code>$…$</code> " +
            "unless you are already inside math. Use <b>$$</b> on its own line for a display equation.</div>";
    eqPop.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true, mathMl: true, svg: true } });
  }

  // Are we already between inline $ delimiters on this line?
  function insideMath(surface) {
    const v = surface.value.slice(0, surface.selectionStart);
    const line = v.slice(v.lastIndexOf("\n") + 1);
    let count = 0;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === "$" && line[i - 1] !== "\\") count++;
    }
    return count % 2 === 1;
  }

  function insertEquation(tpl) {
    const surface = activeEditor();
    if (!surface) return;
    let text = tpl;
    if (!insideMath(surface)) text = "$" + text.trim() + "$";
    const caret = text.indexOf(CARET);
    text = text.replace(CARET, "");
    const at = surface.selectionStart;
    surface.focus();
    replaceRange(surface, surface.selectionStart, surface.selectionEnd, text);   // undo-safe
    const pos = at + (caret === -1 ? text.length : caret);
    surface.setSelectionRange(pos, pos);
    setDirty(true);
  }

  if (!HAS_MATH) $("btn-eq").closest(".popover-wrap").style.display = "none";
  $("btn-eq").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!eqPop.dataset.built) { buildPalette(); eqPop.dataset.built = "1"; }
    eqPop.classList.toggle("on");
    $("btn-eq").classList.toggle("toggled", eqPop.classList.contains("on"));
  });
  eqPop.addEventListener("click", (e) => {
    e.stopPropagation();
    const b = e.target.closest("button[data-tex]");
    if (b) insertEquation(b.dataset.tex);
  });

  /* ── Find & replace ─────────────────────────────
     A textarea gives us nothing here: the browser's own find can search the
     rendered preview but not the source, so in Edit mode there was no way to
     locate a string at all. Replacements go through replaceRange so they land
     on the native undo stack like every other edit. */
  const findBar = $("find-bar"), findInput = $("find-input"), replaceInput = $("replace-input");
  let matches = [], matchIdx = -1;
  const findOptions = () => ({caseSensitive:$("find-case").checked, wholeWord:$("find-word").checked, regex:$("find-regex").checked});
  for (const id of ["find-case", "find-word", "find-regex"]) $(id).addEventListener("change", () => { runFind(false); });

  function runFind(keepIndex) {
    const surface = activeEditor();
    const q = findInput.value;
    const result = MDEdit.searchMatches(surface ? surface.value : "", q, findOptions());
    matches = result.matches;
    $("find-error").textContent = result.error ? "Invalid regular expression: " + result.error : "";
    findInput.setAttribute("aria-invalid", String(Boolean(result.error)));
    $("find-replace").disabled = $("find-all").disabled = Boolean(result.error);
    if (!keepIndex || matchIdx < 0 || matchIdx >= matches.length) matchIdx = matches.length ? 0 : -1;
    paintCount();
  }
  function paintCount() {
    const c = $("find-count");
    c.textContent = findInput.value ? (matches.length ? (matchIdx + 1) + "/" + matches.length : "0/0") : "";
    c.classList.toggle("none", !!findInput.value && !matches.length);
  }
  function revealMatch() {
    const surface = activeEditor();
    if (!surface) return;
    if (matchIdx < 0 || !matches.length) return;
    const { start, end } = matches[matchIdx];
    surface.focus();
    surface.setSelectionRange(start, end);
    // approximate, but enough to bring a match on screen in a wrapped textarea
    const line = surface.value.slice(0, start).split("\n").length - 1;
    const lh = parseFloat(getComputedStyle(surface).lineHeight) || 20;
    const top = line * lh;
    if (top < surface.scrollTop || top > surface.scrollTop + surface.clientHeight - lh * 2) {
      surface.scrollTop = Math.max(0, top - surface.clientHeight / 3);
    }
    paintCount();
  }
  function stepMatch(dir) {
    if (!matches.length) return;
    matchIdx = (matchIdx + dir + matches.length) % matches.length;
    revealMatch();
  }
  function afterEdit() { setDirty(true); }

  function replaceCurrent() {
    const surface = activeEditor();
    if (!surface) return;
    runFind(true);
    if (matchIdx < 0 || !matches.length) return;
    const { start, end } = matches[matchIdx];
    replaceRange(surface, start, end, MDEdit.replacementText(replaceInput.value, matches[matchIdx], findOptions().regex));
    afterEdit();
    runFind(true);
    revealMatch();
  }
  function replaceAll() {
    const surface = activeEditor();
    if (!surface) return;
    runFind(true);
    if (!matches.length) return;
    const r = replaceInput.value, n = matches.length;
    let out = "", last = 0;
    for (const match of matches) { out += surface.value.slice(last, match.start) + MDEdit.replacementText(r, match, findOptions().regex); last = match.end; }
    out += surface.value.slice(last);
    replaceRange(surface, 0, surface.value.length, out);   // one undo step for the lot
    afterEdit();
    runFind(false);
    setStatus("Replaced " + n + " occurrence" + (n === 1 ? "" : "s"));
  }

  function openFind() {
    const surface = activeEditor();
    if (!surface) return;
    if (document.body.dataset.view === "preview") setView("split");
    document.body.classList.add("find-open");
    const sel = surface.value.slice(surface.selectionStart, surface.selectionEnd);
    if (sel && !sel.includes("\n")) findInput.value = sel;
    findInput.focus();
    findInput.select();
    runFind(false);
  }
  function closeFind() {
    document.body.classList.remove("find-open");
    const surface = activeEditor();
    if (surface) surface.focus();
  }

  findInput.addEventListener("input", () => { runFind(false); revealMatch(); });
  findInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); stepMatch(e.shiftKey ? -1 : 1); }
    else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
  });
  replaceInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); replaceCurrent(); }
    else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
  });
  $("find-next").addEventListener("click", () => stepMatch(1));
  $("find-prev").addEventListener("click", () => stepMatch(-1));
  $("find-replace").addEventListener("click", replaceCurrent);
  $("find-all").addEventListener("click", replaceAll);
  $("find-close").addEventListener("click", closeFind);
  $("editor-surfaces").addEventListener("keydown", (e) => {
    if (!isActiveEditorEvent(e)) return;
    if (e.key === "Escape" && document.body.classList.contains("find-open")) closeFind();
  });

  /* ── Installed-app plumbing ─────────────────── */
  // Registering a service worker makes the app installable and lets it open
  // offline. It is skipped when the file is opened straight from disk.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  // When the installed app is launched by opening a .md file (double-click,
  // "Open with"), we receive real file handles — so Save writes back to that
  // very file, exactly like the drag-and-drop path.
  if ("launchQueue" in window && typeof LaunchParams !== "undefined" && "files" in LaunchParams.prototype) {
    launchQueue.setConsumer(async (params) => {
      if (!params.files || !params.files.length) return;
      await controllerReady;
      return MDEdit.openLaunchFiles(
        params.files,
        (files, sourceKeys) => openBrowserFiles(files, sourceKeys),
        (error) => setStatus("Could not open that file — " + (error.message || "unknown error")),
      );
    });
  }

  /* ── Boot ───────────────────────────────────── */
  async function hashText(text) {
    const bytes = new TextEncoder().encode(text);
    if (window.crypto && window.crypto.subtle) {
      const digest = await window.crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }
    let hash = 2166136261;
    for (const byte of bytes) hash = Math.imul(hash ^ byte, 16777619);
    return (hash >>> 0).toString(16).padStart(64, "0");
  }

  function captureActiveDocument(format) {
    return controller.captureActiveDocument({ format });
  }

  function captureSharedWorkspace() {
    return {
      previewScrollTop: previewPane.scrollTop,
      viewMode: document.body.dataset.view || "split",
      tocOpen: document.body.classList.contains("toc-open"),
      find: {
        open: document.body.classList.contains("find-open"),
        query: findInput.value,
        replacement: replaceInput.value,
        matchIndex: matchIdx,
        ...findOptions(),
      },
    };
  }

  function applySharedWorkspace(workspace) {
    setView(workspace.viewMode || "split");
    setToc(Boolean(workspace.tocOpen));
    $("find-case").checked = Boolean(workspace.find?.caseSensitive);
    $("find-word").checked = Boolean(workspace.find?.wholeWord);
    $("find-regex").checked = Boolean(workspace.find?.regex);
    findInput.value = workspace.find && workspace.find.query || "";
    replaceInput.value = workspace.find && workspace.find.replacement || "";
    matchIdx = workspace.find && Number.isInteger(workspace.find.matchIndex) ? workspace.find.matchIndex : -1;
    document.body.classList.toggle("find-open", Boolean(workspace.find && workspace.find.open));
    previewPane.scrollTop = Number.isFinite(workspace.previewScrollTop) ? workspace.previewScrollTop : 0;
    runFind(true);
  }

  const documentDetailsCache = new WeakMap();

  function updateDocumentDetails() {
    const active = controller && controller.activeDocument();
    const surface = activeEditor();
    const details = $("document-details");
    if (!active || !surface) {
      details.textContent = "";
      return;
    }
    let metadata = documentDetailsCache.get(active);
    if (!metadata || metadata.revision !== active.editRevision) {
      // Use model content: textarea.value normalizes CRLF and CR to LF.
      const content = active.content;
      const endings = [
        /\r\n/.test(content) && "CRLF",
        /(^|[^\r])\n/.test(content) && "LF",
        /\r(?!\n)/.test(content) && "CR",
      ].filter(Boolean);
      const ending = endings.length > 1 ? "Mixed" : endings[0] || "None";
      const encoding = content.startsWith("\uFEFF") ? "UTF-8 BOM" : "UTF-8";
      const bytes = new TextEncoder().encode(content).byteLength;
      const unit = bytes < 1024 ? 0 : bytes < 1024 ** 2 ? 1 : bytes < 1024 ** 3 ? 2 : 3;
      const size = `${Number((bytes / 1024 ** unit).toFixed(1))} ${["B", "KB", "MB", "GB"][unit]}`;
      metadata = { revision: active.editRevision, text: `${encoding} ◦ ${ending} ◦ ${size}` };
      documentDetailsCache.set(active, metadata);
    }
    const caret = surface.selectionDirection === "backward" ? surface.selectionStart : surface.selectionEnd;
    const text = surface.value;
    let line = 1, lineStart = 0, next;
    while ((next = text.indexOf("\n", lineStart)) !== -1 && next < caret) {
      line++;
      lineStart = next + 1;
    }
    const column = Array.from(text.slice(lineStart, caret)).length + 1;
    details.textContent = `Ln: ${line}, Col: ${column} ◦ ${metadata.text}`;
  }

  document.addEventListener("selectionchange", updateDocumentDetails);
  for (const name of ["select", "keyup", "click"]) {
    document.addEventListener(name, event => {
      if (isActiveEditorEvent(event)) updateDocumentDetails();
    }, true);
  }

  function syncActiveSurface() {
    updateDocumentDetails();
    const active = controller && controller.activeDocument();
    if (!active || !workspaceView) {
      $("btn-save-all").disabled = true;
      updateWindowTitle(null);
      return null;
    }
    filenameEl.value = active.displayName;
    filenameEl.style.width = Math.min(260, Math.max(60, (active.displayName.length + 2) * 8)) + "px";
    dirtyDot.classList.toggle("on", Boolean(active.dirty));
    $("btn-save-all").disabled = ![...controller.session.documents.values()].some((document) => document.dirty);
    updateWindowTitle(active);
    if (persistentRecoveryWarning) workspaceView.setDocumentStatus(active.id, {
      recoveryStatus: "failed",
      message: persistentRecoveryWarning,
    });
    scheduleActiveDocumentStats(active.id, active.content);
    if (editorEnhancements) editorEnhancements.updateGutter();
    if (desktopWorkspace) desktopWorkspace.refresh();
    return active;
  }

  function wireCachedPreviewTools() {
    preview.querySelectorAll(".blk-tools").forEach((node) => node.remove());
    preview.querySelectorAll(".code-wrap pre > code").forEach((code) => {
      code.closest(".code-wrap").appendChild(toolButton("Copy", "Copy this code block", (event) => copyCode(code, event.currentTarget)));
    });
    [...preview.querySelectorAll(".table-wrap table")].forEach((table, index) => {
      table.closest(".table-wrap").appendChild(toolButton("CSV", "Download this table as CSV", () => downloadTableCsv(table, index + 1)));
    });
    [...preview.querySelectorAll(".mermaid-block svg")].forEach((svg, index) => {
      svg.closest(".mermaid-block").appendChild(toolButton("SVG", "Download this diagram as SVG", () => downloadDiagramSvg(svg, index + 1)));
    });
  }

  const browserRecoveryEnvironment = nativeApp ? null : MDEdit.createBrowserRecoveryEnvironment(window);
  const sessionIo = nativeApp ? {
    ...nativeApp,
    listenFileOpened(handler) {
      if (!window.__TAURI__ || !window.__TAURI__.event) return () => {};
      // Notifications only wake the listener. The native queue owns delivery,
      // including requests that arrived before this listener was registered.
      return window.__TAURI__.event.listen("file-opened", () => nativeApp.takePendingFiles()
        .then((paths) => Promise.all(paths.map((path) => handler({ payload: path }))))
        .catch((error) => setStatus("Could not open queued files — " + error.message)));
    },
  } : {
    ...browserRecoveryEnvironment.io,
    async readDocument() { throw new Error("native document reads are unavailable"); },
  };

  workspaceView = new MDEdit.WorkspaceView({
    document,
    tabList: $("document-tabs"),
    addButton: $("btn-add-tab"),
    editorSurfaces: $("editor-surfaces"),
    dialogBackdrop: $("dialog-backdrop"),
    dialog: $("app-dialog"),
    dialogTitle: $("dialog-title"),
    dialogMessage: $("dialog-message"),
    dialogDocuments: $("dialog-documents"),
    dialogActions: $("dialog-actions"),
    statusElement: statusEl,
    isMac,
    captureSharedWorkspace,
    applySharedWorkspace,
    onActivate(documentId, options) {
      controller.activateDocument(documentId, options);
      syncActiveSurface();
    },
    async onClose(documentId) {
      const result = await controller.closeDocument(documentId);
      if (result && result.closed) browserFileHandles.delete(documentId);
      syncActiveSurface();
    },
    onCommand(command, event) {
      runTabCommand(command, event).catch((error) => setStatus(error.message));
    },
    onAdd() { newDoc(); },
    onReorder(documentId, targetDocumentId) {
      controller.reorderDocument(documentId, targetDocumentId);
      syncActiveSurface();
    },
    onEditorInput(documentId, content) {
      controller.onEditorInput(documentId, content);
      if (findInput.value) runFind(true);
      syncActiveSurface();
    },
  });
  workspaceView.renderDocument = () => {
    syncActiveSurface();
    if (findInput.value) runFind(true);
  };
  workspaceView.beforeReloadDocument = () => desktopAssets?.clearCache();
  workspaceView.clearPreview = () => {
    previewOwner = null;
    preview.replaceChildren();
    tocEl.replaceChildren();
  };
  workspaceView.setPreview = (html, capture) => {
    previewOwner = { documentId: capture.documentId, editRevision: capture.editRevision };
    preview.innerHTML = html;
    wireCachedPreviewTools();
    buildToc();
    updateStats(capture.content);
  };

  let recoveryScheduler;
  recoveryScheduler = new MDEdit.RecoveryScheduler({
    async write(documentId, revision) {
      const model = controller && controller.session && controller.session.documents.get(documentId);
      const controlledSnapshot = controller && controller.recoverySnapshotForWrite(documentId, revision);
      if (!controlledSnapshot) return controller.writeRecoveryCheckpoint(documentId, revision);
      const snapshotJson = controlledSnapshot || JSON.stringify(model.toSnapshot());
      await sessionIo.writeRecoveryDocument(documentId, revision, snapshotJson);
      if (controller.session.documents.get(documentId) === model && model.snapshotRevision === revision) {
        model.persistedRevision = revision;
      }
    },
    onStatus(documentId, status, error) {
      if (controller) controller.onRecoveryStatus(documentId, status, error);
      else workspaceView.setDocumentStatus(documentId, { recoveryStatus: status, message: error && error.message });
    },
  });

  controller = new MDEdit.SessionController({
    io: sessionIo,
    saveDocumentStrategy: nativeApp ? null : browserSaveDocumentStrategy,
    onRecoveryPerformance(metric) {
      const measurements = window.__MDEDIT_RECOVERY_PERFORMANCE__ || [];
      measurements.push(metric);
      window.__MDEDIT_RECOVERY_PERFORMANCE__ = measurements.slice(-20);
    },
    scheduler: recoveryScheduler,
    view: workspaceView,
    dialogs: {
      showOpenError(path, error) { setStatus("Could not open " + path + " — " + error.message); },
    },
    legacyStorage: {
      getItem(key) {
        if (browserRecoveryEnvironment) return browserRecoveryEnvironment.legacyStorage.getItem(key);
        try { return window.localStorage.getItem(key); } catch (_) { return null; }
      },
      removeItem(key) {
        if (browserRecoveryEnvironment) browserRecoveryEnvironment.legacyStorage.removeItem(key);
        else window.localStorage.removeItem(key);
      },
    },
    hashText,
    idFactory: () => window.crypto.randomUUID(),
    requestAnimationFrame: (callback) => window.requestAnimationFrame(callback),
    renderer: {
      optionsKey: () => theme,
      render(capture, { renderWhenHidden = false } = {}) {
        return {
          async commit(_sameCapture, isCurrent) {
            if (!isCurrent()) return null;
            await new Promise((resolve) => setTimeout(resolve, 150));
            if (!isCurrent()) return null;
            // In Edit-only mode the shared preview is not rendered. Deferring
            // this work until Preview or Split is requested keeps large-tab
            // activation independent from Markdown/DOM construction.
            if (document.body.dataset.view === "edit" && !renderWhenHidden) return null;
            previewOwner = { documentId: capture.documentId, editRevision: capture.editRevision };
            mermaidPending = render(capture.content, isCurrent, preview, true, capture.path);
            await mermaidPending;
            return isCurrent() ? preview.innerHTML : null;
          },
        };
      },
      renderForExport,
    },
    exporter: {
      export(capture) {
        return ({ md: download, html: exportHtml, png: exportPng, pdf: exportPdf })[capture.format](capture);
      },
    },
  });
  if (window.__MDEDIT_TEST_HOOK__) window.__MDEDIT_TEST_HOOK__.controller = controller;
  resolveControllerReady(controller);
  MDEdit.installRecentDocuments({ document, controller, nativeApp });
  editorEnhancements = MDEdit.installEditorEnhancements({ document, activeEditor, replaceRange, onChange: afterEdit });

  desktopAssets = MDEdit.createDesktopAssets({ document, nativeApp, controller, activeEditor, replaceRange, onChange: afterEdit, setStatus });
  desktopWorkspace = MDEdit.installDesktopWorkspace({ document, nativeApp, controller, setStatus, onReload: () => desktopAssets?.clearCache() });

  async function installNativeCloseGuard() {
    const windowApi = window.__TAURI__ && window.__TAURI__.window;
    if (!nativeApp || !windowApi || typeof windowApi.getCurrentWindow !== "function") return null;
    const currentWindow = windowApi.getCurrentWindow();
    if (!currentWindow || typeof currentWindow.onCloseRequested !== "function") return null;
    const handleCloseRequest = MDEdit.createNativeCloseRequestHandler(controller, currentWindow);
    return currentWindow.onCloseRequested(handleCloseRequest);
  }
  const nativeCloseGuardReady = installNativeCloseGuard();
  if (browserRecoveryEnvironment && browserRecoveryEnvironment.error) {
    persistentRecoveryWarning = "Recovery storage is unavailable — edits will only be kept for this page";
    setStatus("", true);
  }

  const WELCOME = `# Welcome to MDedit

A fast, private desktop Markdown editor — **your documents stay on your device**.

## Getting started

- **Drop** a Markdown file anywhere in the window, or use **Open**
- Type on the left and see the rendered document on the right
- **Save** writes back to the current file; **Save as** creates a new copy
- **Export** the rendered document as HTML, PNG, or PDF
- Your work is restored automatically if the app closes unexpectedly

## What it understands

GitHub-flavored markdown, including:

| Feature | Example |
| ------- | ------- |
| Emphasis | *italic*, **bold**, ~~strikethrough~~ |
| Inline code | \`const x = 42\` |
| Links | [ivystrides.com](https://www.ivystrides.com) |

- [x] Task lists
- [ ] Like this one

> [!TIP]
> Use the list button up top for a **table of contents**, and the **Aa** button to adjust text size and line width. Hover a table or a diagram to download it on its own.

### Syntax-highlighted code

\`\`\`js
// fenced code blocks, now with highlighting
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

${HAS_MATH ? `### Math

Inline math like $E = mc^2$ works, and so do display equations:

$$
\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}
$$

` : ""}${HAS_DIAGRAMS ? `### Diagrams

Mermaid code fences render as live diagrams:

\`\`\`mermaid
flowchart LR
  A[Drop a .md file] --> B{Edit it?}
  B -- yes --> C[Make changes] --> D[Save back to your device]
  B -- no --> E[Just read]
\`\`\`

` : ""}### Callouts

> [!NOTE]
> GitHub-style callouts — NOTE, TIP, IMPORTANT, WARNING, and CAUTION — all render properly.

---

Shortcuts: **${isMac ? "⌘" : "Ctrl+"}S** save · **${isMac ? "⌘⇧" : "Ctrl+Shift+"}S** save as · **${isMac ? "⌘" : "Ctrl+"}O** open
`;

  (async () => {
    await nativeCloseGuardReady;
    let pendingOpen = null;
    if (nativeApp && window.__TAURI__ && window.__TAURI__.core) {
      await controller.start().catch((error) => setStatus("File-open listener failed — " + error.message));
      const paths = await nativeApp.takePendingFiles().catch(() => []);
      if (paths.length) pendingOpen = controller.openPaths(paths, { replaceStartupPlaceholder: true });
    }
    await controller.restore();
    if (window.__MDEDIT_TEST_HOOK__) window.__MDEDIT_TEST_HOOK__.restored = true;
    if (pendingOpen) await pendingOpen;
    let active = controller.activeDocument();
    if (controller.restoreOutcome === "fresh-session"
        && active && !active.canonicalPath && !active.content && !active.dirty
        && controller.session.documents.size === 1) {
      controller.onEditorInput(active.id, WELCOME);
      const welcomeCapture = controller.captureActiveDocument();
      const welcomeSha256 = await hashText(WELCOME);
      controller.recordCapturedSave(welcomeCapture, { contentSha256: welcomeSha256, diskSha256: welcomeSha256 });
      workspaceView.ensureEditor(active);
    }
    active = controller.activeDocument();
    if (active) controller.activateDocument(active.id);
    syncActiveSurface();
  })().catch((error) => setStatus("Startup failed — " + error.message, true));
  // Focusing a textarea leaves the caret at the end of its text and scrolls
  // there, which would open the document at its last line (and drag the
  // preview along with it, via the scroll sync). Start at the top instead.
  previewPane.scrollTop = 0;
})();
</script>
</body>
